name: Auto-Clean

on:
  #自动清理：每月1日、15日（每两周）早上3点
  schedule:
    - cron: 0 19 1,15 * *
  #手动清理
  workflow_dispatch:

permissions: write-all

jobs:
  auto_clean:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old Releases and Workflows
        uses: ophub/delete-releases-workflows@main
        with:
          gh_token: ${{secrets.GITHUB_TOKEN}}
          delete_releases: true
          releases_keep_latest: 5
          delete_tags: true
          delete_workflows: true
          workflows_keep_day: 0

      - name: Delete Old Artifacts
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: |
          # 构建产物通过 Release 发布，Artifacts 无保留价值，全部删除以释放 Actions 存储配额（0.5GB）
          set -euo pipefail
          ARTIFACT_IDS=$(gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[].id' 2>/dev/null || true)
          if [ -z "$ARTIFACT_IDS" ]; then
            echo "No artifacts found, nothing to delete."
            exit 0
          fi
          COUNT=0
          for ARTIFACT_ID in $ARTIFACT_IDS; do
            gh api -X DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" && COUNT=$((COUNT+1)) || echo "warning: failed to delete artifact $ARTIFACT_ID"
          done
          echo "Deleted $COUNT artifacts to release Actions storage quota."
